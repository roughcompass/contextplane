[project]
name = "contextplane"
version = "0.0.1"
description = "DE Context Plane for Agents, an open-source platform of record for engineering capabilities."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
readme = "README.md"

dependencies = [
    "fastapi==0.115.5",
    # Undeclared until now: nothing in this codebase parsed a multipart
    # request before source admission's upload route. FastAPI/Starlette
    # already depend on it transitively for form/file parsing, so it was
    # present but unpinned — a bump elsewhere in the dependency graph could
    # have silently changed multipart parsing behavior with no diff here.
    "python-multipart==0.0.32",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.49",
    "asyncpg==0.30.0",
    # asyncpg drives the application; psycopg2 exists for the two places that
    # need a synchronous driver. APScheduler's SQLAlchemyJobStore is sync-only,
    # and `contextplane/ingest/runner.py` rewrites the asyncpg URL to psycopg2 to
    # build it; `scripts/partition_migrate.py` uses it for explicit
    # transaction control over DDL.
    #
    # Undeclared until now, and the absence was invisible: _make_jobstore
    # catches the ImportError and falls back to MemoryJobStore with a warning.
    # So a deployment that set SCHEDULER_USE_MEMORY_JOBSTORE=false — the shipped
    # Helm default — got an in-process jobstore anyway. Scheduled jobs did not
    # survive a restart, and with more than one replica every cron job ran once
    # per pod.
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.0",
    "pgvector==0.3.6",
    "apscheduler==3.10.4",
    "httpx==0.28.1",
    "numpy==2.2.0",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-exporter-otlp==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    "prometheus-client==0.21.1",
    "structlog==24.4.0",
    "authlib==1.3.2",
    # Direct on purpose, though authlib already pulls it in. ARC signs context
    # receipts with Ed25519, verifies host attestations, and AEAD-seals its
    # continuation tokens — all from this library. Left transitive, an authlib
    # bump could change signature verification in the one subsystem whose whole
    # value is tamper-evidence, with no diff to review in this repo. Pinned at
    # the version authlib resolves today, so declaring it changes nothing now
    # and makes any future move deliberate.
    "cryptography==49.0.0",
    "jsonschema==4.23.0",
    # Pinned like everything else here. Version comparison decides which
    # capability revision a caller resolves to, so a resolver change is a
    # behaviour change in the catalog's read path, not a transparent upgrade.
    "semver==3.0.4",
    # Embedding inference. onnxruntime + tokenizers is ~150 MB and runs the same
    # all-MiniLM-L6-v2 weights that sentence-transformers would, at the same 384
    # dimensions — but without torch, which is ~750 MB on its own and does not
    # fit the memory envelope the default deployment targets. Keeping torch out
    # of the base install is also what lets the model ship inside the image for
    # deployments that cannot reach the Hugging Face Hub. See contextplane/embedding/.
    "onnxruntime==1.28.0",
    # Held at 0.22.2 by the optional `torch` extra, not by anything here: it
    # pulls transformers, which caps tokenizers at <=0.23.0, and 0.23.0 was
    # never released as a final (only an rc) — so 0.22.2 is the newest release
    # that satisfies the bound. Going above it makes `pip install -e ".[torch]"`
    # unresolvable, which takes the parity test and the sentence_transformers
    # provider with it. Raise this only alongside a transformers bump.
    "tokenizers==0.22.2",
    "cachetools==5.5.0",
    # Pinned for the same reason as cryptography above: this library builds the
    # MCP tool catalog, which is a wire contract clients read. A floating range
    # meant a new release could change tool names, argument schemas, or
    # description text with no diff to review here — and the catalog has already
    # been shown to drift from a cause outside this repo's source, when a Python
    # version difference changed every tool's description. Held at the version
    # that resolves today, so this changes nothing now and makes any future move
    # deliberate.
    "mcp==1.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "testcontainers==4.9.0",
    "mypy==1.13.0",
    "ruff==0.8.2",
    # The module-boundary contract (see [tool.importlinter] at the end of this
    # file). Pinned like every other gate: this tool decides whether a layering
    # violation lands, and a floating range could change what "violation" means
    # between two runs of the same commit.
    "import-linter==2.13",
    "respx==0.21.1",
    "pytest-timeout==2.3.1",
    "types-jsonschema==4.23.0.20240813",
    "types-PyYAML==6.0.12.20260408",
]

# What a third party needs to run `contextplane.extraction.contract_suite` against
# its own adapter, and nothing else. Deliberately separate from `dev`: the whole
# value of shipping a runnable contract is that someone outside this repo can run
# it without taking on this repo's toolchain.
#
# It stays out of the runtime dependency list for the same reason -- the shipped
# image and the air-gapped install must not grow a test runner because a module
# that nothing at runtime imports happens to live under `contextplane/`. The suite
# itself imports no pytest at all, so `contextplane.extraction.contract_suite` is
# importable with none of this installed; this extra provides the *runner*, not
# an import the module needs.
contract-suite = [
    "pytest>=8.0",
]

# Postgres binaries delivered through pip, for machines with no container
# runtime and no other way to install a server. Deliberately separate
# from `dev`: it is the last of several sources the dev stack will try
# (see scripts/devstack/pg_provider.py), and it must never be something
# `pip install -e ".[dev]"` can fail on.
#
# The markers reflect what the project actually publishes wheels for.
# Outside that set — CPython 3.13, Linux arm64 — there is no wheel and
# pip would try to build Postgres from source, so the dependency simply
# does not apply and the dev stack uses another source instead.
devstack = [
    "pgserver==0.1.4; python_version < '3.13' and platform_machine != 'aarch64'",
]

# The reference sentence-transformers implementation, for EMBEDDING_PROVIDER=
# sentence_transformers and for the ONNX parity test to measure against.
#
# Kept out of the base install on purpose. It pulls torch — roughly 750 MB, more
# than the rest of the dependency tree combined — which busts the memory limits
# the default deployment ships with. Base installs must stay torch-free: a
# conformance test asserts it, because the moment torch is a base dependency the
# image can no longer be built for a network-isolated deployment.
torch = [
    "sentence-transformers==3.3.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contextplane*"]

# Data files the packages read at import time. Without this they are left out of
# the wheel, and the install only appears to work when the process happens to
# run from the repo root — where the source tree shadows site-packages. Any
# import from another working directory fails on a missing file.
[tool.setuptools.package-data]
contextplane = [
    "service/catalog/progression_definition_schema.json",
    "embedding/model_manifest.json",
    "context/workspace_recall_decision.json",
]

# The first coverage configuration this repo has had. `--cov=registry` lives in
# the Makefile and, until now, needed nothing else: every module under
# `contextplane/` was product code that unit tests could reach.
#
# `contract_suite.py` is the exception that forces the table to exist. It is a
# proof shipped for consumers to run against their own adapters, and its
# networked tier asks for things no in-process provider can do -- structured
# output forced out of a model, an error taxonomy from a real endpoint. Those
# lines are unreachable from unit scope by construction, not by neglect.
#
# Left in the measurement, they are ~30 permanently-red lines dragging a floor
# that exists to describe product coverage. The only ways to make them green are
# to stand up a fake networked provider whose sole purpose is to be counted, or
# to lower the floor -- and this repo's own rule is that the ratchet is not
# chased up with coverage-only tests carrying no behavioural assertion. Omitting
# the module says what is true: it is the thing that measures providers, not a
# provider.
#
# Scoped to this one file, deliberately. A blanket `contextplane/extraction/*` here
# would take the adapters with it, and those are exactly what the floor is for.
[tool.coverage.run]
omit = [
    "contextplane/extraction/contract_suite.py",
]

# The gate must compare the number it prints. At the default precision of 0,
# coverage rounds the total before testing it against `--cov-fail-under`, while
# the failure banner prints the unrounded value -- so a run at 79.90% against a
# floor of 80 printed "FAIL Required test coverage of 80% not reached" and then
# exited 0. Every regression landing in [79.50, 80.00) passed the ratchet while
# announcing that it had not.
#
# Two decimals, not one: the ratchet's job is to catch the smallest real drop,
# and one decimal leaves the same hole one order of magnitude narrower. This
# also makes the per-file table and the pass/fail line agree, which is what
# stopped anyone trusting either.
[tool.coverage.report]
precision = 2

# How many workers `make test-integration` runs by default. Committed rather than
# passed on the command line so that the canonical command is the thing being
# measured -- a caller who could choose the count could report a number for a
# configuration the repository does not have.
#
# 8 on the strength of a measurement rather than a guess: the tier is ~450 s
# serial and 85.7 s at 8 workers on the reference host, ~5.2x, with 379 s of CPU
# behind it. 16 workers is *slower* than 8 -- oversubscription on a 6
# performance + 12 efficiency core machine -- so this is near the useful knee
# rather than the largest number that fits.
#
# There is no upper bound on the tier's wall clock, deliberately. The gate is
# that the suite runs in parallel and beats serial; pinning an absolute ceiling
# made the number the deliverable and cost far more than it bought.
[tool.contextplane.integration]
workers = 8

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Leave asyncio_default_fixture_loop_scope unset. Tests mix module-scoped
# async fixtures with function-scoped tests, and neither "function" nor
# "session" satisfies both: "function" causes ScopeMismatch on module
# fixtures, "session" causes "Future attached to a different loop" on
# per-test asyncpg engines. Each async fixture declares its own scope
# explicitly, which gives the right behavior in every case.
testpaths = ["tests"]
# The guards under scripts/ import their shared helpers as `from checklib
# import ...`, which is what resolves when the Makefile and CI invoke a guard
# as a top-level script and what mypy checks against. Tests reach the same
# guards through the package path (`from scripts import check_x`), and in that
# form scripts/ is not on sys.path, so checklib is unresolvable and collection
# fails. Putting scripts/ on the test path makes both spellings resolve to one
# module. The two alternatives do not work: scripts/__init__.py turns the
# module into scripts.checklib and makes mypy reject every guard's import, and
# a try/except dual import makes mypy report the same source file under two
# module names — a file-level error no ignore comment can suppress.
#
# It also removes an ordering accident. tests/unit collected clean only
# because test_check_arc_approval_writers.py sorts early and inserts scripts/
# into sys.path before any later file needs it; a suite that passes because of
# filename order is one rename away from failing.
pythonpath = ["scripts"]
filterwarnings = [
    # pytest-asyncio deprecated the event_loop-fixture override pattern; our
    # custom event_loop fixtures pre-date that deprecation. Suppress the
    # noise until we migrate to the event_loop_policy fixture form.
    "ignore:The event_loop fixture provided by pytest-asyncio has been redefined:DeprecationWarning",
    "ignore::pytest.PytestDeprecationWarning",
    # Spurious "coroutine was never awaited" warnings emitted by AsyncMock
    # when production code does not await a return value it never needed
    # (`session.add` is sync; AsyncMock pretends it might be async).
    "ignore:coroutine .*_execute_mock_call.* was never awaited:RuntimeWarning",
]
markers = [
    "compose: requires the dev compose stack (mock-oauth2-server + mock-entitlement-service + postgres) to be up; gated on COMPOSE_STACK_UP env var",
    "perf: long-running performance test; excluded from default test runs",
    "arc_sandbox_container: builds and runs the shipped image to prove container-level sandbox isolation; gated on ARC_SANDBOX_CONFORMANCE env var because a cold `docker build` cannot fit the conformance suite's per-test timeout",
    "slow: slow test; excluded from default unit-test run",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Preview mode belongs here, under [tool.ruff.lint], and nowhere else. Ruff's
# top-level [tool.ruff] `preview` flag would also switch the *formatter* to
# preview style -- empirically, that reformats a few hundred files this repo
# has never opted into and `make format-check` never reviewed. Scoped to
# [tool.ruff.lint] it only changes which lint rules are selectable; the
# formatter is unaffected (verified with `ruff format --check .`). This is
# the one flag in this file where table placement, not the value, is the
# whole story -- keep it here even if a future edit reorganizes the rest.
preview = true
# RUF100 keeps the suppressions honest: a noqa for a rule that is not
# enabled (or not firing) is dead weight that outlives its reason, and ~240
# of them had accumulated for rulesets nothing checked.
# ANN401 (dynamically-typed `Any` in a function signature) catches a
# parameter or return type that is under-specified rather than genuinely
# open-ended. Enabled for contextplane/ + scripts/ only -- see the per-file-ignore
# below for why tests/ is out of scope.
# BLE001 (blind `except Exception:`) catches a catch-all that could instead
# name the failure it actually expects. Enabled for contextplane/ + scripts/ only
# -- tests/ routinely asserts against mocks that raise arbitrary exception
# types, which is a legitimate reason to catch broadly in a test double and
# not a case this rule should flag.
# S (bandit) is a family, not a single rule -- it covers everything from SQL
# string construction to subprocess calls to hardcoded-secret-shaped
# literals. Enabled for contextplane/ + scripts/ only; see the per-file-ignore
# below for which of its member codes tests/ carves out and why. Real
# findings get fixed; safe-by-construction patterns bandit can't see (a
# closed set of identifiers interpolated into SQL with every value still
# bound through `text()` params, a subprocess call with a fixed argv and no
# caller input) get a per-site `# noqa: <code> - <reason>` naming why.
# PLC0415 (import not at top of file) only exists as a selectable rule once
# preview is on, which is why it lands in the same edit as the flag above.
# Enabled for contextplane/ + scripts/ only -- see the per-file-ignore below for
# why tests/ is out of scope. A function-local import is fixed by moving it
# to the top of the file wherever nothing depends on the deferral; where a
# real import cycle or an intentionally-deferred optional/heavy dependency
# needs it to stay local, it gets a per-site `# noqa: PLC0415 - <reason>`.
# D100-D103 (missing docstring in a public module/class/method/function) are
# scoped to contextplane/service/ and contextplane/api/ only -- the service and HTTP
# surface this ratchet repairs, not every corner of the package. Enforced via
# global select + per-file-ignores rather than per-file select because ruff
# has no per-directory select. Other registry subpackages (workers, wiring,
# storage, security, ingest, embedding, extraction, arc, audit, auth, usage),
# its bare top-level modules, scripts/, and tests/ are excluded below;
# widening the rule there is a separately recorded choice, not a default.
# D104-D107 (package, magic-method, nested-class, __init__ docstrings) are
# excluded everywhere: package initializers, dunder methods, nested classes,
# and constructors are not the public contract a caller reads a docstring
# for -- the class docstring already carries that.
select = ["E", "F", "I", "B", "UP", "ANN401", "BLE001", "S", "PLC0415", "RUF100", "D100", "D101", "D102", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Test doubles (mocks, stubs, fakes) are the dominant source of ANN401 hits
# under tests/ -- a fake typed precisely would just re-declare the real
# collaborator's signature next to it, two places for the two to drift apart.
# D6's own examples (SQLAlchemy Row helpers, arc corpus payloads, promotion's
# closed-set writes, the erasure helper, the baseline migration's vocabulary
# interpolation) are all production-code concerns; enabling this against
# tests/ would not catch any of them.
# BLE001 under tests/ is the same story: fakes and fixtures that stand in for
# a real collaborator legitimately catch broadly (e.g. a fake session's
# cleanup path, a mock-shaped adapter) because the point of the double is to
# not care which exception a caller raises.
# S101 (bare `assert`) is pytest's own mechanism -- assert is how a test
# fails. Bandit's own documentation names test-directory `assert` as its
# standard false-positive class; enabling it here would either mass-suppress
# (defeating the rule) or force `assert x, "msg"` gymnastics on thousands of
# ordinary test assertions for no security benefit.
# S105/S106/S107 (hardcoded-password-shaped string literal / keyword
# argument / function default) fire on test fixtures by design: fake OIDC
# tokens, fake webhook HMAC secrets, a throwaway testcontainers Postgres
# password for an ephemeral, network-isolated container. None of these
# protect anything real -- the whole point of a fixture is a fixed,
# throwaway value.
# S608 (SQL built via f-string/concatenation) fires on test helpers that
# seed or query fixture rows using a closed set of table names known at
# authoring time (a `RULES`/`_QUEUE_*`-shaped constant, a hardcoded tuple in
# the test's own body) with every actual value still bound through `text()`
# params -- structurally the same non-issue as the production sites this
# family's per-site noqas explain, and test code never touches
# caller-supplied/adversarial input in the first place.
# S603/S607 (subprocess call / partial executable path) fire on test-harness
# code that shells out to fixed-argv dev tooling (initdb, pg_ctl, docker
# info, `sys.executable <script>`) the same way scripts/devstack/ does in
# production -- no caller input reaches any of these argvs either.
# S311 (non-cryptographic `random`) fires on seeded RNGs used to generate
# deterministic test corpora and perf-test filler data -- never used to
# produce a token, id, or anything security-sensitive.
# S110 (bare `try`/`except`/`pass`) is deliberately NOT in this list: unlike
# the codes above, whether a swallowed exception in a test is safe depends
# on whether it could be hiding a real assertion failure, which is exactly
# the vacuous-test risk the assertion-less-test checker (see
# scripts/check_test_assertions.py) exists to catch elsewhere. The handful
# of sites are each disposed of with their own reasoned per-site noqa
# instead.
# PLC0415 (import not at top of file) fires routinely in tests/ for reasons
# that don't apply to production code: importing a fixture/helper inside a
# single test function to keep it isolated from other tests in the same
# file, or deferring an import that only that one test needs. Production
# code doesn't have that isolation motive, which is why this code stays a
# per-site noqa in contextplane/ + scripts/ but is a blanket carve-out here.
# D100-D103 are out of scope for tests/ for the same reason they are out of
# scope for scripts/ and every contextplane/ subpackage besides service/ and
# api/: test helpers are not the public service/API contract this ratchet
# repairs (see the select-list comment above).
"tests/**" = [
    "ANN401", "BLE001", "S101", "S105", "S106", "S107", "S608", "S603", "S607", "S311", "PLC0415",
    "D100", "D101", "D102", "D103",
]

# D100-D103 are scoped to contextplane/service/ and contextplane/api/ only (see the
# select-list comment above). Ruff has no per-directory select, only a global
# select plus per-file-ignores, so the narrower scope is expressed here as an
# ignore covering every other production path: registry's other subpackages,
# its bare top-level modules, and scripts/.
"contextplane/{arc,audit,auth,embedding,extraction,ingest,security,storage,usage,wiring,workers}/**" = [
    "D100", "D101", "D102", "D103",
]
"contextplane/{__init__,config,exceptions,logging_config,main,metrics,sync_worker,types}.py" = [
    "D100", "D101", "D102", "D103",
]
"scripts/**" = ["D100", "D101", "D102", "D103"]

# D101 only, not the whole D100-D103 family: this module's own docstring and
# every route file that imports from it still carry the ratchet. Pydantic
# promotes a class docstring into the generated OpenAPI component's
# `description` field, and these view models are wire contracts whose
# component schemas are frozen in the committed `openapi.json` snapshot until
# the authoring-surface freeze task runs -- adding a docstring here would
# silently grow that snapshot on an unrelated change. The router these models
# used to live in already carried this same gap (undocumented request/
# response classes excluded from its own `__all__`); this ignore makes that
# pre-existing state explicit in its new home instead of relying on the same
# thing being true by accident.
"contextplane/api/schemas/memory_curation.py" = ["D101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() in default arguments is the idiomatic dependency-injection pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "fastapi.Cookie"]

[tool.mypy]
strict = true
python_version = "3.12"
# Matches the gate scope exactly (Makefile SRC_ROOTS and pre-commit both
# check scripts/ too) — a bare `mypy` run must not silently skip code the
# gates enforce.
files = ["contextplane", "scripts"]

# pgserver ships no type information, and it is an optional extra that is
# deliberately absent on most machines (see the `devstack` extra above).
# Either way the import is unresolvable here, so the dev stack accesses it
# defensively and mypy is told not to care.
[[tool.mypy.overrides]]
module = ["pgserver", "pgserver.*"]
ignore_missing_imports = true

# onnxruntime ships no stubs, and tokenizers ships no py.typed marker. Both are
# base dependencies, so the embedding providers annotate their own boundaries
# and mypy is told not to look inside.
[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "tokenizers", "tokenizers.*"]
ignore_missing_imports = true

# asyncpg ships no py.typed marker. The application reaches it through SQLAlchemy,
# which is typed; the one place it is used directly is the perf seeder, where COPY is
# not worth doing through the ORM.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# sentence-transformers is behind the optional `torch` extra and absent from a
# base install, so the import is unresolvable on most machines by design.
[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

# =============================================================================
# Module boundaries (import-linter)
# =============================================================================
#
# The first declarative statement of this package's layering. Until now the
# boundary was 6,801 lines of hand-written guards under scripts/ that each
# encode one rule in Python; mypy and ruff state no module-boundary rules at
# all, which is why eleven inverted layer imports could exist without anything
# flagging them. Those guards are not deleted here — retiring the ones this
# contract subsumes is a separate decision, and `check_import_direction.py`'s
# scripts/ <-> tests/ rule has to stay regardless because import-linter's graph
# only contains the installed package.
#
# Run by `make lint` (and therefore by CI's lint job). A layer naming a module
# that does not exist is an error from import-linter itself, so this contract
# cannot go quietly vacuous the way a guard scanning a moved directory could.

[tool.importlinter]
root_packages = ["contextplane"]

# -----------------------------------------------------------------------------
# The layering
# -----------------------------------------------------------------------------
#
# Flat by necessity, not by preference. import-linter 2.13's LayersContract
# rejects nested layer modules — declaring `contextplane.wiring`,
# `contextplane.api` and `contextplane.api.container` together fails with
# "Modules have shared descendants" — and the contract type has no exclusion
# field. So: one layer per top-level child of `contextplane`, no exceptions.
# Anything finer (the service/governance kernel rule below) is expressed as a
# ForbiddenContract instead.
#
# The order was measured, not chosen: an AST scan of every cross-package import
# under contextplane/ (909 at column 0, 69 function-local), condensed to the
# package graph, with the six edge groups in `ignore_imports` removed. What
# remains is a DAG, and this is its layering. Four positions are worth knowing
# because intuition gets them backwards: `auth` and `usage` sit *below*
# `storage` rather than beside `security`; `security` sits above `audit`, not
# beside it; and `context/` is not a leaf — nine layers have to exist above it
# before anything imports it.
#
# `|` between siblings means *independent*: they may not import each other
# either. Every pair on a shared line was checked to have no edge in either
# direction, so the weaker `:` form is not needed anywhere.
#
# `exhaustive` is the point of the whole contract. import-linter only checks
# modules that a layer names, so a new top-level package would otherwise be
# invisible here — silently exempt from the boundary rather than subject to it,
# and the more packages this codebase grows the more of it the contract would
# quietly stop describing. With `exhaustive = true`, `mkdir contextplane/foo`
# fails `make lint` until somebody says which layer `foo` belongs in. Being
# forced to answer that question is the deliverable; the list below is just
# where the answers are kept.
[[tool.importlinter.contracts]]
name = "contextplane layers"
type = "layers"
containers = ["contextplane"]
exhaustive = true
layers = [
    "main | sync_worker",
    "wiring",
    "api",
    "observability | workspaces",
    # Signal ingestion reads context receipts and admission, and nothing below
    # `context` reads signals; only `api` and `wiring` construct what lives here.
    # Its own layer rather than a `|` sibling of the pair above: no independence
    # from `observability` or `workspaces` has been checked, and the weaker form
    # would assert one.
    "signals",
    "context",
    "arc | workers",
    "extraction | ingest",
    "service",
    # The profile domain: five packages, all below `service` and above
    # `retention`, in the order the architecture's component list implies they
    # depend on each other. An upper layer here may import a lower one, so the
    # intended direction reads top-down: `ownership` assigns an accountable
    # owner to a relationship endpoint, so it sits above `relationships`;
    # relationships connect entities, so they sit above `entities`; a grant
    # shares entities and relationships that already exist, so `sharing` sits
    # below both; and `profile` is the bottom of the five because it defines
    # the revisions, types, and definitions the other four are expressed in —
    # it imports only `storage` and below.
    #
    # Five separate layers rather than `|` siblings: independence has not been
    # checked for any pair, and the `|` form would assert it. Stated as a
    # direction now, before any of these packages has a module in it, so the
    # first import that disagrees fails `make lint` instead of setting the
    # direction by accident.
    "ownership",
    "relationships",
    "entities",
    "sharing",
    "profile",
    # Every consumer of the retention tables imports downward into them — the
    # erasure writers in `service/memory/`, the propagation workers, the
    # derivative registrars in `context/`, and the aggregate reads — while
    # `retention` itself imports only `storage` and below.
    "retention",
    "security",
    "audit",
    "storage",
    "auth | embedding | logging_config",
    "config | pagination | usage",
    "config_grammar | exceptions | metrics | types",
]

# Every entry below is an upward import this phase deliberately left standing,
# and each one is spelled out module-by-module rather than with a wildcard on
# purpose: import-linter errors on an ignore that matches nothing, so a fixed
# edge forces its own entry to be deleted, and a *new* import in the same
# direction is not covered by the exemption and fails the build. The list is a
# debt register that cannot silently grow.
#
# Two of the six are the deferred, function-local imports that break this
# package's only real cycles. import-linter's graph sees function-local imports
# exactly like top-level ones, so leaving them unlisted would mean the contract
# fails on the very imports that exist to keep it satisfiable.
ignore_imports = [
    # service <-> extraction, measured both ways: 6 imports extraction -> service
    # against 4 service -> extraction. The minority direction loses and is
    # exempted; the majority stays enforced.
    "contextplane.service.memory.claim_assertion -> contextplane.extraction.containment",
    "contextplane.service.memory.claim_assertion -> contextplane.extraction.service",
    "contextplane.service.memory.claim_erasure -> contextplane.extraction.strategies",
    "contextplane.service.memory.session_events -> contextplane.extraction.strategies",

    # Deferred cycle-breaker, protected by this phase's no-hoisting non-goal:
    # session_events enqueues into the extraction drain worker from inside a
    # function because hoisting the import re-forms a five-module cycle.
    "contextplane.service.memory.session_events -> contextplane.workers.extraction_drain",

    # Deferred cycle-breaker, same protection: config reads the extraction
    # provider registry to validate a setting, and extraction's provider
    # registry reads config.
    "contextplane.config -> contextplane.extraction.provider_registry",

    # context <-> security, measured both ways: 2 imports context -> security
    # (admission runs the PII patterns and scanner) against 1 the other way.
    # The single import loses.
    "contextplane.security.pii_guard -> contextplane.context.admission",

    # context <-> workspaces, measured both ways: 8 imports workspaces ->
    # context against 5 the other way. The minority direction loses.
    "contextplane.context.queries -> contextplane.workspaces.models",
    "contextplane.context.queries -> contextplane.workspaces.queries_audience",
    "contextplane.context.resume -> contextplane.workspaces.models",
    "contextplane.context.resume -> contextplane.workspaces.queries_audience",
    "contextplane.context.arms -> contextplane.workspaces.recall",
]

# -----------------------------------------------------------------------------
# The governance kernel
# -----------------------------------------------------------------------------
#
# What flat layers cannot say. `service/governance/` decides what a caller is
# allowed to see; every other service subpackage asks it. Nested modules are
# fine in a ForbiddenContract (unlike layers), so the rule is stated directly:
# the kernel imports downward — types, exceptions, storage models — and nothing
# else. Its siblings are named individually rather than as `contextplane.service`
# because a container cannot forbid itself.
#
# This passes today. It is here so that it keeps passing: the failure mode it
# guards against is a visibility decision reaching sideways for the catalog or
# memory service it is supposed to be independent of, which is the kind of edge
# that gets added in a hurry and noticed in a review six weeks later.
[[tool.importlinter.contracts]]
name = "governance kernel imports nothing sideways or upward"
type = "forbidden"
source_modules = ["contextplane.service.governance"]
forbidden_modules = [
    "contextplane.api",
    "contextplane.wiring",
    "contextplane.service.catalog",
    "contextplane.service.memory",
    "contextplane.service.notifications",
    "contextplane.service.operations",
    "contextplane.service.retrieval",
    "contextplane.service.workspace",
]

# -----------------------------------------------------------------------------
# ARC internals are private
# -----------------------------------------------------------------------------
#
# ARC is 48 submodules behind one front door (`contextplane/arc/__init__.py`).
# Before that door existed, 16 files in six other packages imported 106 times
# straight into `arc.service.*`, `arc.types`, `arc.schemas.*` and `arc.workers.*`
# — so ARC's internal layout was load-bearing for code that has no business
# knowing it, and moving one ARC module was a repo-wide edit.
#
# `source_modules` names every top-level module and package under
# `contextplane` except the two exemptions below — not the subset that happened
# to hold ARC consumers when the front door was built. That subset was tried
# first and went blind within days: `contextplane.workspaces` grew a direct
# `arc.service.receipt_read` import that no source line covered, so the contract
# reported KEPT over a violation it simply was not looking at. A source list
# that enumerates consumers is a list of yesterday's consumers; a source list
# that enumerates the package tree only misses a package that does not exist
# yet, and the layers contract's `exhaustive = true` above fails the build on
# one of those until somebody places it — with this list on screen.
#
# Most of the names below are also covered by that layering, which forbids
# everything under `arc` from importing `contextplane.arc` at all. The overlap
# is deliberate: layer positions get reordered, and a reorder must not silently
# open ARC's internals to a package that just moved up.
#
# Two exemptions, both structural. `contextplane.arc` itself cannot appear: its
# own submodules import each other constantly, and a package forbidden from its
# internals is a package that cannot be written. `contextplane.storage` is the
# other, and it stands for two imports rather than one, both under
# `storage/migrations/`: `env.py` imports `contextplane.arc.models` so Alembic's
# autogenerate sees the `arc_`-prefixed tables, and
# `versions/0001_baseline_schema.py` imports `contextplane.arc.vocabularies` so
# the baseline DDL seeds the frozen content-classification and receipt-event
# vocabularies from the one module that defines them instead of re-typing those
# strings into SQL. Both imports are the whole reason their migration works, and
# neither is visible to this contract in the first place — `storage/migrations/`
# has no `__init__.py`, so grimp never walks into it and would report KEPT over
# either edge. That blind spot is why the exemption has to say what it covers:
# the day the package becomes importable, both edges appear at once. Naming
# `storage` here and then exempting the imports again would be two statements of
# the same fact; leaving it unnamed is one. Tests are outside `contextplane`
# entirely and so are not an exemption at all — a unit test of an internal is a
# legitimate reason to know where that internal lives.
#
# `allow_indirect_imports` is true, and that is the contract, not a loophole.
# Every consumer now reaches ARC's internals *through* `contextplane.arc` — that
# chain is exactly what the front door is for. Left at the default, this
# contract would flag `api.container -> arc -> arc.service.artifact` and be
# unsatisfiable by any design that has a front door at all. What stays forbidden
# is the direct edge: naming an ARC submodule in an import statement.
[[tool.importlinter.contracts]]
name = "ARC internals are private; consumers use the contextplane.arc front door"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "contextplane.api",
    "contextplane.audit",
    "contextplane.auth",
    "contextplane.config",
    "contextplane.config_grammar",
    "contextplane.context",
    "contextplane.embedding",
    "contextplane.entities",
    "contextplane.exceptions",
    "contextplane.extraction",
    "contextplane.ingest",
    "contextplane.logging_config",
    "contextplane.main",
    "contextplane.metrics",
    "contextplane.observability",
    "contextplane.ownership",
    "contextplane.pagination",
    "contextplane.profile",
    "contextplane.relationships",
    "contextplane.retention",
    "contextplane.security",
    "contextplane.service",
    "contextplane.sharing",
    "contextplane.signals",
    "contextplane.sync_worker",
    "contextplane.types",
    "contextplane.usage",
    "contextplane.wiring",
    "contextplane.workers",
    "contextplane.workspaces",
]
forbidden_modules = [
    "contextplane.arc.drafter",
    "contextplane.arc.metrics",
    "contextplane.arc.models",
    "contextplane.arc.models_approval_challenge",
    "contextplane.arc.models_observation",
    "contextplane.arc.models_operational_chain",
    "contextplane.arc.models_proposal",
    "contextplane.arc.models_risk_envelope",
    "contextplane.arc.models_source_admission",
    "contextplane.arc.models_verifier_enrollment",
    "contextplane.arc.sandbox",
    "contextplane.arc.schemas",
    "contextplane.arc.service",
    "contextplane.arc.types",
    "contextplane.arc.vocabularies",
    "contextplane.arc.wiring",
    "contextplane.arc.workers",
]
