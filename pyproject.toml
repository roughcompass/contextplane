[project]
name = "registry"
version = "0.0.1"
description = "Open-source, self-hostable platform-of-record for engineering capabilities."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
readme = "README.md"

dependencies = [
    "fastapi==0.115.5",
    # Undeclared until now: nothing in this codebase parsed a multipart
    # request before source admission's upload route. FastAPI/Starlette
    # already depend on it transitively for form/file parsing, so it was
    # present but unpinned — a bump elsewhere in the dependency graph could
    # have silently changed multipart parsing behavior with no diff here.
    "python-multipart==0.0.32",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.49",
    "asyncpg==0.30.0",
    # asyncpg drives the application; psycopg2 exists for the two places that
    # need a synchronous driver. APScheduler's SQLAlchemyJobStore is sync-only,
    # and `registry/ingest/runner.py` rewrites the asyncpg URL to psycopg2 to
    # build it; `scripts/partition_migrate.py` uses it for explicit
    # transaction control over DDL.
    #
    # Undeclared until now, and the absence was invisible: _make_jobstore
    # catches the ImportError and falls back to MemoryJobStore with a warning.
    # So a deployment that set SCHEDULER_USE_MEMORY_JOBSTORE=false — the shipped
    # Helm default — got an in-process jobstore anyway. Scheduled jobs did not
    # survive a restart, and with more than one replica every cron job ran once
    # per pod.
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.0",
    "pgvector==0.3.6",
    "apscheduler==3.10.4",
    "httpx==0.28.1",
    "numpy==2.2.0",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-exporter-otlp==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    "prometheus-client==0.21.1",
    "structlog==24.4.0",
    "authlib==1.3.2",
    # Direct on purpose, though authlib already pulls it in. ARC signs context
    # receipts with Ed25519, verifies host attestations, and AEAD-seals its
    # continuation tokens — all from this library. Left transitive, an authlib
    # bump could change signature verification in the one subsystem whose whole
    # value is tamper-evidence, with no diff to review in this repo. Pinned at
    # the version authlib resolves today, so declaring it changes nothing now
    # and makes any future move deliberate.
    "cryptography==49.0.0",
    "jsonschema==4.23.0",
    "semver>=3.0",
    # Embedding inference. onnxruntime + tokenizers is ~150 MB and runs the same
    # all-MiniLM-L6-v2 weights that sentence-transformers would, at the same 384
    # dimensions — but without torch, which is ~750 MB on its own and does not
    # fit the memory envelope the default deployment targets. Keeping torch out
    # of the base install is also what lets the model ship inside the image for
    # deployments that cannot reach the Hugging Face Hub. See registry/embedding/.
    "onnxruntime==1.28.0",
    # Held at 0.22.2 by the optional `torch` extra, not by anything here: it
    # pulls transformers, which caps tokenizers at <=0.23.0, and 0.23.0 was
    # never released as a final (only an rc) — so 0.22.2 is the newest release
    # that satisfies the bound. Going above it makes `pip install -e ".[torch]"`
    # unresolvable, which takes the parity test and the sentence_transformers
    # provider with it. Raise this only alongside a transformers bump.
    "tokenizers==0.22.2",
    "cachetools==5.5.0",
    "mcp>=1.2,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "testcontainers==4.9.0",
    "mypy==1.13.0",
    "ruff==0.8.2",
    "respx==0.21.1",
    "pytest-timeout==2.3.1",
    "types-jsonschema==4.23.0.20240813",
    "types-PyYAML==6.0.12.20260408",
]

# Postgres binaries delivered through pip, for machines with no container
# runtime and no other way to install a server. Deliberately separate
# from `dev`: it is the last of several sources the dev stack will try
# (see scripts/devstack/pg_provider.py), and it must never be something
# `pip install -e ".[dev]"` can fail on.
#
# The markers reflect what the project actually publishes wheels for.
# Outside that set — CPython 3.13, Linux arm64 — there is no wheel and
# pip would try to build Postgres from source, so the dependency simply
# does not apply and the dev stack uses another source instead.
devstack = [
    "pgserver==0.1.4; python_version < '3.13' and platform_machine != 'aarch64'",
]

# The reference sentence-transformers implementation, for EMBEDDING_PROVIDER=
# sentence_transformers and for the ONNX parity test to measure against.
#
# Kept out of the base install on purpose. It pulls torch — roughly 750 MB, more
# than the rest of the dependency tree combined — which busts the memory limits
# the default deployment ships with. Base installs must stay torch-free: a
# conformance test asserts it, because the moment torch is a base dependency the
# image can no longer be built for a network-isolated deployment.
torch = [
    "sentence-transformers==3.3.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["registry*"]

# Data files the packages read at import time. Without this they are left out of
# the wheel, and the install only appears to work when the process happens to
# run from the repo root — where the source tree shadows site-packages. Any
# import from another working directory fails on a missing file.
[tool.setuptools.package-data]
registry = [
    "service/platform/progression_definition_schema.json",
    "embedding/model_manifest.json",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Leave asyncio_default_fixture_loop_scope unset. Tests mix module-scoped
# async fixtures with function-scoped tests, and neither "function" nor
# "session" satisfies both: "function" causes ScopeMismatch on module
# fixtures, "session" causes "Future attached to a different loop" on
# per-test asyncpg engines. Each async fixture declares its own scope
# explicitly, which gives the right behavior in every case.
testpaths = ["tests"]
filterwarnings = [
    # pytest-asyncio deprecated the event_loop-fixture override pattern; our
    # custom event_loop fixtures pre-date that deprecation. Suppress the
    # noise until we migrate to the event_loop_policy fixture form.
    "ignore:The event_loop fixture provided by pytest-asyncio has been redefined:DeprecationWarning",
    "ignore::pytest.PytestDeprecationWarning",
    # Spurious "coroutine was never awaited" warnings emitted by AsyncMock
    # when production code does not await a return value it never needed
    # (`session.add` is sync; AsyncMock pretends it might be async).
    "ignore:coroutine .*_execute_mock_call.* was never awaited:RuntimeWarning",
]
markers = [
    "compose: requires the dev compose stack (mock-oauth2-server + mock-entitlement-service + postgres) to be up; gated on COMPOSE_STACK_UP env var",
    "perf: long-running performance test; excluded from default test runs",
    "slow: slow test; excluded from default unit-test run",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Preview mode belongs here, under [tool.ruff.lint], and nowhere else. Ruff's
# top-level [tool.ruff] `preview` flag would also switch the *formatter* to
# preview style -- empirically, that reformats a few hundred files this repo
# has never opted into and `make format-check` never reviewed. Scoped to
# [tool.ruff.lint] it only changes which lint rules are selectable; the
# formatter is unaffected (verified with `ruff format --check .`). This is
# the one flag in this file where table placement, not the value, is the
# whole story -- keep it here even if a future edit reorganizes the rest.
preview = true
# RUF100 keeps the suppressions honest: a noqa for a rule that is not
# enabled (or not firing) is dead weight that outlives its reason, and ~240
# of them had accumulated for rulesets nothing checked.
# ANN401 (dynamically-typed `Any` in a function signature) catches a
# parameter or return type that is under-specified rather than genuinely
# open-ended. Enabled for registry/ + scripts/ only -- see the per-file-ignore
# below for why tests/ is out of scope.
# BLE001 (blind `except Exception:`) catches a catch-all that could instead
# name the failure it actually expects. Enabled for registry/ + scripts/ only
# -- tests/ routinely asserts against mocks that raise arbitrary exception
# types, which is a legitimate reason to catch broadly in a test double and
# not a case this rule should flag.
# S (bandit) is a family, not a single rule -- it covers everything from SQL
# string construction to subprocess calls to hardcoded-secret-shaped
# literals. Enabled for registry/ + scripts/ only; see the per-file-ignore
# below for which of its member codes tests/ carves out and why. Real
# findings get fixed; safe-by-construction patterns bandit can't see (a
# closed set of identifiers interpolated into SQL with every value still
# bound through `text()` params, a subprocess call with a fixed argv and no
# caller input) get a per-site `# noqa: <code> - <reason>` naming why.
# PLC0415 (import not at top of file) only exists as a selectable rule once
# preview is on, which is why it lands in the same edit as the flag above.
# Enabled for registry/ + scripts/ only -- see the per-file-ignore below for
# why tests/ is out of scope. A function-local import is fixed by moving it
# to the top of the file wherever nothing depends on the deferral; where a
# real import cycle or an intentionally-deferred optional/heavy dependency
# needs it to stay local, it gets a per-site `# noqa: PLC0415 - <reason>`.
# D100-D103 (missing docstring in a public module/class/method/function) are
# scoped to registry/service/ and registry/api/ only -- the service and HTTP
# surface this ratchet repairs, not every corner of the package. Enforced via
# global select + per-file-ignores rather than per-file select because ruff
# has no per-directory select. Other registry subpackages (workers, wiring,
# storage, security, ingest, embedding, extraction, arc, audit, auth, usage),
# its bare top-level modules, scripts/, and tests/ are excluded below;
# widening the rule there is a separately recorded choice, not a default.
# D104-D107 (package, magic-method, nested-class, __init__ docstrings) are
# excluded everywhere: package initializers, dunder methods, nested classes,
# and constructors are not the public contract a caller reads a docstring
# for -- the class docstring already carries that.
select = ["E", "F", "I", "B", "UP", "ANN401", "BLE001", "S", "PLC0415", "RUF100", "D100", "D101", "D102", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Test doubles (mocks, stubs, fakes) are the dominant source of ANN401 hits
# under tests/ -- a fake typed precisely would just re-declare the real
# collaborator's signature next to it, two places for the two to drift apart.
# D6's own examples (SQLAlchemy Row helpers, arc corpus payloads, promotion's
# closed-set writes, the erasure helper, the baseline migration's vocabulary
# interpolation) are all production-code concerns; enabling this against
# tests/ would not catch any of them.
# BLE001 under tests/ is the same story: fakes and fixtures that stand in for
# a real collaborator legitimately catch broadly (e.g. a fake session's
# cleanup path, a mock-shaped adapter) because the point of the double is to
# not care which exception a caller raises.
# S101 (bare `assert`) is pytest's own mechanism -- assert is how a test
# fails. Bandit's own documentation names test-directory `assert` as its
# standard false-positive class; enabling it here would either mass-suppress
# (defeating the rule) or force `assert x, "msg"` gymnastics on thousands of
# ordinary test assertions for no security benefit.
# S105/S106/S107 (hardcoded-password-shaped string literal / keyword
# argument / function default) fire on test fixtures by design: fake OIDC
# tokens, fake webhook HMAC secrets, a throwaway testcontainers Postgres
# password for an ephemeral, network-isolated container. None of these
# protect anything real -- the whole point of a fixture is a fixed,
# throwaway value.
# S608 (SQL built via f-string/concatenation) fires on test helpers that
# seed or query fixture rows using a closed set of table names known at
# authoring time (a `RULES`/`_QUEUE_*`-shaped constant, a hardcoded tuple in
# the test's own body) with every actual value still bound through `text()`
# params -- structurally the same non-issue as the production sites this
# family's per-site noqas explain, and test code never touches
# caller-supplied/adversarial input in the first place.
# S603/S607 (subprocess call / partial executable path) fire on test-harness
# code that shells out to fixed-argv dev tooling (initdb, pg_ctl, docker
# info, `sys.executable <script>`) the same way scripts/devstack/ does in
# production -- no caller input reaches any of these argvs either.
# S311 (non-cryptographic `random`) fires on seeded RNGs used to generate
# deterministic test corpora and perf-test filler data -- never used to
# produce a token, id, or anything security-sensitive.
# S110 (bare `try`/`except`/`pass`) is deliberately NOT in this list: unlike
# the codes above, whether a swallowed exception in a test is safe depends
# on whether it could be hiding a real assertion failure, which is exactly
# the vacuous-test risk the assertion-less-test checker (see
# scripts/check_test_assertions.py) exists to catch elsewhere. The handful
# of sites are each disposed of with their own reasoned per-site noqa
# instead.
# PLC0415 (import not at top of file) fires routinely in tests/ for reasons
# that don't apply to production code: importing a fixture/helper inside a
# single test function to keep it isolated from other tests in the same
# file, or deferring an import that only that one test needs. Production
# code doesn't have that isolation motive, which is why this code stays a
# per-site noqa in registry/ + scripts/ but is a blanket carve-out here.
# D100-D103 are out of scope for tests/ for the same reason they are out of
# scope for scripts/ and every registry/ subpackage besides service/ and
# api/: test helpers are not the public service/API contract this ratchet
# repairs (see the select-list comment above).
"tests/**" = [
    "ANN401", "BLE001", "S101", "S105", "S106", "S107", "S608", "S603", "S607", "S311", "PLC0415",
    "D100", "D101", "D102", "D103",
]

# D100-D103 are scoped to registry/service/ and registry/api/ only (see the
# select-list comment above). Ruff has no per-directory select, only a global
# select plus per-file-ignores, so the narrower scope is expressed here as an
# ignore covering every other production path: registry's other subpackages,
# its bare top-level modules, and scripts/.
"registry/{arc,audit,auth,embedding,extraction,ingest,security,storage,usage,wiring,workers}/**" = [
    "D100", "D101", "D102", "D103",
]
"registry/{__init__,config,exceptions,logging_config,main,metrics,sync_worker,types}.py" = [
    "D100", "D101", "D102", "D103",
]
"scripts/**" = ["D100", "D101", "D102", "D103"]

# D101 only, not the whole D100-D103 family: this module's own docstring and
# every route file that imports from it still carry the ratchet. Pydantic
# promotes a class docstring into the generated OpenAPI component's
# `description` field, and these view models are wire contracts whose
# component schemas are frozen in the committed `openapi.json` snapshot until
# the authoring-surface freeze task runs -- adding a docstring here would
# silently grow that snapshot on an unrelated change. The router these models
# used to live in already carried this same gap (undocumented request/
# response classes excluded from its own `__all__`); this ignore makes that
# pre-existing state explicit in its new home instead of relying on the same
# thing being true by accident.
"registry/api/schemas/memory_curation.py" = ["D101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() in default arguments is the idiomatic dependency-injection pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "fastapi.Cookie"]

[tool.mypy]
strict = true
python_version = "3.12"
# Matches the gate scope exactly (Makefile SRC_ROOTS and pre-commit both
# check scripts/ too) — a bare `mypy` run must not silently skip code the
# gates enforce.
files = ["registry", "scripts"]

# pgserver ships no type information, and it is an optional extra that is
# deliberately absent on most machines (see the `devstack` extra above).
# Either way the import is unresolvable here, so the dev stack accesses it
# defensively and mypy is told not to care.
[[tool.mypy.overrides]]
module = ["pgserver", "pgserver.*"]
ignore_missing_imports = true

# onnxruntime ships no stubs, and tokenizers ships no py.typed marker. Both are
# base dependencies, so the embedding providers annotate their own boundaries
# and mypy is told not to look inside.
[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "tokenizers", "tokenizers.*"]
ignore_missing_imports = true

# asyncpg ships no py.typed marker. The application reaches it through SQLAlchemy,
# which is typed; the one place it is used directly is the perf seeder, where COPY is
# not worth doing through the ORM.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# sentence-transformers is behind the optional `torch` extra and absent from a
# base install, so the import is unresolvable on most machines by design.
[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true
