name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title against conventional-commit format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$TITLE" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert)(\([a-z0-9-]+\))?!?: .+'; then
            echo "ok: $TITLE"
          else
            echo "PR title must be conventional-commit format (it becomes the squash commit): '$TITLE'"
            exit 1
          fi
