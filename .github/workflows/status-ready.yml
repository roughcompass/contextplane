name: Status ready

on:
  issues:
    types: [closed]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: "open", labels: "status:blocked",
            });
            for (const issue of open) {
              const refs = [...(issue.body ?? "").matchAll(/blocked by:?\s+#(\d+)/gi)];
              if (!refs.length) continue;
              const states = await Promise.all(refs.map(([, n]) =>
                github.rest.issues.get({ ...context.repo, issue_number: +n })
                  .then(r => r.data.state).catch(() => "open")
              ));
              if (!states.every(s => s === "closed")) continue;
              await github.rest.issues.removeLabel({
                ...context.repo, issue_number: issue.number, name: "status:blocked",
              }).catch(() => {});
              await github.rest.issues.addLabels({
                ...context.repo, issue_number: issue.number, labels: ["status:ready"],
              }).catch(async () => {
                await github.rest.issues.createLabel({
                  ...context.repo, name: "status:ready", color: "0e8a16",
                  description: "All blockers closed; claimable",
                });
                await github.rest.issues.addLabels({
                  ...context.repo, issue_number: issue.number, labels: ["status:ready"],
                });
              });
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: "All blockers closed — now claimable (`status:ready`).",
              });
            }
