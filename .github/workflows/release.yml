# ============================================================================
# Release — one supported wiring (GitHub Actions).
#
# The canonical command surface is the `Makefile` at the repo root. Test
# gates and build/package commands invoke `make <target>` — only the
# platform-specific steps (Docker login, cosign keyless sign, OCI push,
# GitHub release create) stay inline because they depend on GH-Actions
# composite actions and secret injection syntax.
#
# Other CI platforms (GitLab CI, Jenkins, Buildkite, …) wire their own
# release flow using the same Make targets for build/package and their
# own platform's mechanisms for sign/push. The Makefile at the repo
# root is the canonical command surface; every CI runner invokes the
# same `make <target>` calls.
# ============================================================================
name: release

on:
  push:
    tags:
      - 'v*'

# Permissions required for GHCR push, cosign keyless signing, and GitHub releases.
permissions:
  contents: write        # gh release create + upload SBOM
  packages: write        # ghcr.io push
  id-token: write        # cosign keyless OIDC signing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/roughcompass/contextplane
  HELM_IMAGE_NAME: ghcr.io/roughcompass/helm/contextplane

jobs:
  # ── Gate: run the full test suite before releasing ────────────────────────

  # Mirrors ci.yml's lint job exactly. A release must never be gated more
  # weakly than a PR — this list and ci.yml's are kept in lockstep.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make lint
      - run: make format-check
      - run: make doc-refs
      - run: make privileged-writes
      - run: make usage-boundary
      - run: make env-documented
      - run: make test-hygiene
      - run: make seeds-validate
      - run: make auth-consolidation-gate

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make typecheck

  unit:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make test-unit

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make test-integration

  conformance:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make test-conformance

  # Drives the k6 read scenario against the same locally-managed stack the
  # native-stack CI job proves on every PR: Python 3.12 for the pgserver
  # wheels, dev-up migrates to head, dev-token writes .env.dev (including
  # DEV_TENANT_SLUG — the X-Tenant-Id header takes the slug, not the UUID),
  # dev-seed gives search real data, dev-jwt mints a real bearer.
  k6-smoke:
    runs-on: ubuntu-latest
    needs: conformance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,devstack]"
      - name: Install k6
        run: |
          curl -sSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6 -y
      - run: make dev-up
      - run: make dev-token
      - run: make dev-seed
      - name: k6 read smoke
        run: |
          set -a; . ./.env.dev; set +a
          TOKEN=$(make dev-jwt)
          BASE_URL=http://localhost:8000 API_TOKEN="$TOKEN" TENANT_ID="$DEV_TENANT_SLUG" \
            k6 run scripts/load_test/read_scenario.js --vus 5 --duration 30s
      - if: always()
        run: make dev-logs LINES=100
      - if: always()
        run: make dev-down

  # ── Release: build, sign, SBOM, Helm push, GitHub release ─────────────────
  # The build and helm-package steps invoke Make targets so they're
  # portable. The sign/push/release steps use GH-Actions-specific
  # composite actions and secret syntax — replicate on your platform.

  release:
    runs-on: ubuntu-latest
    needs: k6-smoke
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag version
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # ── Docker image build (portable via Make) ────────────────────────────

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same pre-fetch as ci.yml's image job — shared runner IPs are
      # rate-limited by the public model hub, so the build receives a staged
      # directory instead of fetching live. Checksums verify either way.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        id: model-cache
        with:
          path: .model-cache
          key: embedding-model-${{ hashFiles('contextplane/embedding/model_manifest.json') }}
      - if: steps.model-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch_embedding_model.py --out .model-cache/all-MiniLM-L6-v2

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            EMBEDDING_MODEL_SOURCE=/build/.model-cache/all-MiniLM-L6-v2
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=contextplane
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.source=https://github.com/roughcompass/contextplane
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Keyless image signing via cosign (platform-specific) ──────────────

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        run: |
          cosign sign --yes \
            "${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      # ── SBOM via syft (platform-specific) ─────────────────────────────────

      - name: Generate SBOM
        uses: anchore/syft-action@v0
        with:
          image: "${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          format: spdx-json
          output-file: sbom.spdx.json

      # ── Helm chart — portable package, GH-specific OCI push ───────────────

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.14.0'

      - name: Package Helm chart
        run: make helm-package HELM_VERSION=${{ steps.version.outputs.tag }}

      - name: Push Helm chart to OCI registry
        working-directory: /tmp/helm-pkg
        run: |
          helm push \
            "contextplane-${{ steps.version.outputs.tag }}.tgz" \
            "oci://${{ env.REGISTRY }}/contextplane/helm"

      # ── GitHub release (platform-specific) ────────────────────────────────

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "contextplane ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            /tmp/helm-pkg/contextplane-${{ steps.version.outputs.tag }}.tgz \
            sbom.spdx.json
