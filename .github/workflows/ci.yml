# ============================================================================
# Maintainer's CI for this repository (GitHub Actions).
#
# This workflow is the MAINTAINER's release/PR-gate pipeline — it is not
# part of the shipped product. Consumers who fork registry
# wire CI in their own platform (Jenkins, GitLab CI, Buildkite, …) by
# invoking the same Make targets.
#
# The canonical command surface is the `Makefile` at the repo root. Every
# step below is either:
#   - A GitHub-Actions-specific operation (checkout, Python setup), or
#   - A `make <target>` invocation that runs the same command any platform would.
# ============================================================================
name: ci

on:
  push:
    branches: [main]
    paths:
      - 'registry/**'
      - 'scripts/**'
      - 'tests/**'
      - 'seeds/**'
      - 'docs/**'
      - 'eval/**'
      - 'deploy/**'
      # `tools/` holds the ARC reference verifier, whose whole job is to
      # disagree with the Python producer when they diverge. Omitting it here
      # would mean a change to the verifier itself never triggered CI.
      - 'tools/**'
      - '.env.example'
      - 'openapi.json'
      - 'Dockerfile'
      - 'Makefile'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'registry/**'
      - 'scripts/**'
      - 'tests/**'
      - 'seeds/**'
      - 'docs/**'
      - 'eval/**'
      - 'deploy/**'
      # `tools/` holds the ARC reference verifier, whose whole job is to
      # disagree with the Python producer when they diverge. Omitting it here
      # would mean a change to the verifier itself never triggered CI.
      - 'tools/**'
      - '.env.example'
      - 'openapi.json'
      - 'Dockerfile'
      - 'Makefile'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  # The perf suite is too slow for the PR path and too important to run
  # nowhere. Nightly plus on-demand: nothing in CI would previously have
  # noticed tests/perf/ breaking at all.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make lint
      - run: make format-check
      - run: make doc-refs
      - run: make doc-links
      - run: make privileged-writes
      - run: make usage-boundary
      - run: make reachability-audit
      - run: make env-documented
      - run: make helm-env
      # These three are named in the project conventions as gates that run on
      # every commit, and until now no job invoked any of them: the steps here
      # are wired individually rather than through `make all`, so a target
      # missing from this list simply never ran. The convention document was
      # describing something that was not happening.
      - run: make test-hygiene
      - run: make seeds-validate
      - run: make auth-consolidation-gate
      # Skips here by design — it reads the planning repository, which is a
      # separate checkout that CI does not have. It says so rather than
      # reporting a pass.
      - run: make task-records

  # typecheck and unit run in parallel with lint — none consumes another's
  # outputs; the serial chain existed only by convention and quintupled the
  # cold-install wall clock while the pip cache path was broken.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make test-unit

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make test-integration

  conformance:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make test-conformance

  # The ARC authoring-surface canonical vectors are the contract the rest of
  # that phase checks its behavior against, and their value comes from being
  # verified by a second implementation that shares no code with the Python
  # producer. `make all` deliberately does not run this, because Node is not
  # otherwise a dependency of any gate here — which would leave the vectors
  # checked only when someone remembered to run the target. This job is that
  # someone.
  #
  # Node-only: no Python install, no database, so it costs a fraction of the
  # other jobs and needs nothing upstream of it.
  arc-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: make arc-vectors

  # The same suites again, but with the container runtime taken out of the
  # picture. Without this job the no-container path rots silently: every
  # other job here runs on a runner that has Docker, so `REGISTRY_TEST_PG=auto`
  # would always pick testcontainers and nothing would ever exercise the
  # locally managed cluster that developers without a runtime depend on.
  #
  # Python 3.12 rather than 3.13 because that is what the pgserver wheels
  # cover. On a developer machine there are other ways to get Postgres
  # (Postgres.app, a system install) and the version does not matter; on a
  # bare runner, pip is the only one, so this job pins to where the wheel is.
  native-stack:
    runs-on: ubuntu-latest
    needs: unit
    env:
      REGISTRY_TEST_PG: devstack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,devstack]"

      # The suites a developer without a container runtime has to be able
      # to run. These are the gates a PR depends on.
      - run: make test-conformance
      - run: make test-integration

      # And the stack itself: bring it up, confirm every service reports
      # healthy, exercise the auth round-trip, tear it down.
      - run: make dev-up
      - run: make dev-status
      - run: make dev-token
      - name: authenticated request against the local stack
        run: |
          TOKEN=$(make dev-jwt)
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8000/v1/whoami
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/v1/capabilities)" = "401"

      # The only test that drives a real JWT over a socket into a running
      # registry — discovery, JWKS, signature, entitlement lookup, tenant
      # resolution. The test is opt-in (COMPOSE_STACK_UP) so it never joins a
      # developer's suite by ambient accident; this job is the one place a
      # stack is guaranteed up, so it opts in explicitly and `make test-smoke`
      # treats a skip as a failure.
      - run: make test-smoke
        env:
          COMPOSE_STACK_UP: "1"
      - if: always()
        run: make dev-logs LINES=100
      - if: always()
        run: make dev-down

  # Builds the image and proves it still embeds with no network access.
  #
  # Everything else here tests the source tree, where the model artifact is
  # either absent (tests skip) or stubbed. That leaves the parts that only
  # exist in the image untested: the artifact download, the checksum manifest
  # in registry/embedding/, the build-time verification pass, and the claim
  # that a running container needs no egress.
  #
  # The failure this is really guarding against is a stale checksum. The
  # manifest pins bytes on a host nobody here controls; if those bytes are
  # re-uploaded, every build starts failing and without this job the first
  # sign of it would be a release.
  #
  # `make test-airgap` runs the container on a Docker network created with
  # --internal, asserts egress is genuinely unavailable, then drives ingest,
  # the embedding drain, and an ANN search against a Postgres on that network.
  # The model is pre-fetched on the runner and handed to the build as a
  # staged directory: the public hub rate-limits shared runner IPs, so the
  # in-build fetch fails here while succeeding on every other machine. The
  # cache key is the checksum manifest, so re-uploaded bytes still invalidate
  # the cache and fail verification — the manifest stays the trust anchor.
  image:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        id: model-cache
        with:
          path: .model-cache
          key: embedding-model-${{ hashFiles('registry/embedding/model_manifest.json') }}
      - if: steps.model-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch_embedding_model.py --out .model-cache/all-MiniLM-L6-v2
      - run: make test-airgap
        env:
          EMBEDDING_MODEL_SOURCE: /build/.model-cache/all-MiniLM-L6-v2
      # The container-level sandbox isolation proofs (marked
      # `arc_sandbox_container`) are deliberately NOT run here yet. They pass
      # on a macOS Docker Desktop host and fail on this Linux runner, and the
      # cause is not yet diagnosed -- job logs need authentication this
      # checkout does not have, and a GitHub runner is not reproducible
      # locally. Wiring them in while red would have made every future run
      # ambiguous, which is the failure this project already recorded twice.
      #
      # Consequence, stated rather than buried: those four isolation controls
      # (container memory ceiling, cpuset affinity, read-only rootfs, the
      # dedicated socket group) are proven by evidence captured when they were
      # written, and are NOT continuously enforced. Run them deliberately with
      # `ARC_SANDBOX_CONFORMANCE=1 pytest tests/conformance -m arc_sandbox_container`
      # on a host with Docker before changing anything under
      # `registry/arc/sandbox/`, the Dockerfile, or `deploy/helm/values.yaml`.

  # Latency and scale checks. Off the PR path deliberately: the scale fixture
  # seeds a million rows, and `make test-perf` allows 300s per test item
  # including that setup, so a slower runner would flake rather than fail
  # honestly. Nightly and on demand, where a slow run costs nobody a review.
  perf:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make test-perf

