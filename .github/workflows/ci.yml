# ============================================================================
# Maintainer's CI for this repository (GitHub Actions).
#
# This workflow is the MAINTAINER's release/PR-gate pipeline — it is not
# part of the shipped product. Consumers who fork registry
# wire CI in their own platform (Jenkins, GitLab CI, Buildkite, …) by
# invoking the same Make targets.
#
# The canonical command surface is the `Makefile` at the repo root. Every
# step below is either:
#   - A GitHub-Actions-specific operation (checkout, Python setup), or
#   - A `make <target>` invocation that runs the same command any platform would.
# ============================================================================
name: ci

on:
  push:
    branches: [main]
    paths:
      - 'contextplane/**'
      - 'scripts/**'
      - 'tests/**'
      - 'seeds/**'
      - 'docs/**'
      - '.develop/**'
      - 'CONTRIBUTING.md'
      - 'eval/**'
      - 'deploy/**'
      # `tools/` holds the ARC reference verifier, whose whole job is to
      # disagree with the Python producer when they diverge. Omitting it here
      # would mean a change to the verifier itself never triggered CI.
      - 'tools/**'
      - '.env.example'
      - 'openapi.json'
      - 'Dockerfile'
      - 'Makefile'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'contextplane/**'
      - 'scripts/**'
      - 'tests/**'
      - 'seeds/**'
      - 'docs/**'
      - '.develop/**'
      - 'CONTRIBUTING.md'
      - 'eval/**'
      - 'deploy/**'
      # `tools/` holds the ARC reference verifier, whose whole job is to
      # disagree with the Python producer when they diverge. Omitting it here
      # would mean a change to the verifier itself never triggered CI.
      - 'tools/**'
      - '.env.example'
      - 'openapi.json'
      - 'Dockerfile'
      - 'Makefile'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  # The perf suite is too slow for the PR path and too important to run
  # nowhere. Nightly plus on-demand: nothing in CI would previously have
  # noticed tests/perf/ breaking at all.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  # Whether this change touches anything the heavy tiers can possibly exercise.
  # A markdown-only change is fully covered by the `lint` job, which runs
  # doc-links, doc-refs and env-documented; making it also pay ~20 minutes of
  # unit, integration and image buys nothing. Plain git rather than a
  # third-party action, so the check has no supply chain of its own.
  # **Every job below carries `timeout-minutes`, and the number is not a
  # performance target.** GitHub's default is 360 minutes, so a job that hangs
  # blocks a PR for six hours and reports the whole time as "pending" -- which
  # is what happened three times to `integration`, most recently for 6h0m17s
  # with no output. A hang is then indistinguishable from a queue, and the only
  # signal is somebody noticing.
  #
  # Each budget is roughly 3x the job's measured duration on a green run, so a
  # slow runner is not failed for being slow while a hang surfaces in minutes
  # with a log attached. Raise one when a job legitimately grows; do not raise
  # one to make a hanging job pass.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.probe.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: probe
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch -q origin "${{ github.base_ref }}"
            files=$(git diff --name-only "$base"...HEAD)
          else
            files=$(git diff --name-only HEAD~1...HEAD 2>/dev/null || echo "contextplane/forced")
          fi
          echo "changed files:"; echo "$files" | sed 's/^/  /'
          # Compare counts rather than using `grep -v`: -v's exit status is not
          # portable (ugrep returns 1 where GNU grep returns 0), and a probe that
          # silently reports "docs only" for a code change would skip every heavy
          # tier on exactly the change that needed them. -c behaves the same
          # everywhere. `|| true` because grep exits 1 on a zero count.
          total=$(printf '%s\n' "$files" | grep -c . || true)
          docsonly=$(printf '%s\n' "$files" | grep -cE '^(docs/|\.develop/|[^/]*\.md$)' || true)
          echo "total=$total docs=$docsonly"
          if [ "${total:-0}" -gt "${docsonly:-0}" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "-> heavy tiers WILL run"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "-> docs-only, heavy tiers skipped"
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make lint
      - run: make format-check
      - run: make doc-refs
      - run: make doc-links
      - run: make privileged-writes
      - run: make usage-boundary
      - run: make reachability-audit
      - run: make env-documented
      - run: make helm-env
      # Its own step rather than folded into `make lint`, matching every gate
      # around it: a tag failure reported as `lint` sends a reader to ruff.
      - run: make contract-tags
      # These three are named in the project conventions as gates that run on
      # every commit, and until now no job invoked any of them: the steps here
      # are wired individually rather than through `make all`, so a target
      # missing from this list simply never ran. The convention document was
      # describing something that was not happening.
      - run: make test-hygiene
      - run: make seeds-validate
      - run: make auth-consolidation-gate

  # typecheck and unit run in parallel with lint — none consumes another's
  # outputs; the serial chain existed only by convention and quintupled the
  # cold-install wall clock while the pip cache path was broken.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make typecheck

  # Runs the coverage ratchet, which is why this job invokes `test-coverage`
  # rather than `test-unit`. The ratchet measures unit + conformance together:
  # counting the whole package as the denominator while only `tests/unit` fed
  # the numerator meant every conformance-tested module entered permanently
  # uncovered, and the gate was measuring code it did not run.
  #
  # It needs a container runtime because ten conformance modules resolve a
  # database provider. `make test-unit` stays fast and DB-free for the local
  # inner loop; this job is not anybody's inner loop, and putting the ratchet at
  # the root of the graph is what makes a coverage regression fail early rather
  # than after the integration tier.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # `make test-coverage` runs tests/unit AND tests/conformance, and the
    # conformance tier reaches a real database. Naming the provider keeps this
    # job from resolving by whatever the runner happens to have, the same
    # reason the integration job names it rather than relying on `auto`.
    env:
      CONTEXTPLANE_TEST_PG: testcontainers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make test-coverage

  # The one complete integration tier an ordinary PR runs. The provider is named
  # rather than left to `auto`: `auto` resolves by what happens to be on the
  # runner, so the same workflow would measure a different provider on a runner
  # that gained or lost a container runtime, and the result would still be
  # reported under one name. A parity claim needs both members pinned.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `needs: changes`, not `needs: unit`. Nothing is passed between these two
    # jobs -- each does its own checkout and its own `make install-dev` -- so
    # chaining them only serialized two independent tiers, which is the argument
    # the `conformance` job below already makes one level down. Measured: `unit`
    # runs 8.5-11.5 min and `integration` about 8, so the chain put a PR's
    # critical path at 17-20 minutes where `max(unit, integration)` is ~11.5.
    #
    # The cost is real and deliberate: a PR whose unit tier is already broken now
    # burns an integration runner before anyone knows. That trade buys back eight
    # minutes on every PR that passes, which is nearly all of them, and CI wall
    # clock is the thing that was actually hurting.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      CONTEXTPLANE_TEST_PG: testcontainers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make test-integration

  # Depended on integration once, then on unit, and now on neither. There is no
  # artifact passing anywhere in this chain and conformance consumes nothing
  # either job produces, so each link only serialized two independent jobs and
  # put a slower tier in front of a contract-drift gate that would have failed in
  # a fraction of the time. The argument did not stop being true at `unit`.
  #
  # This tier *is* also executed inside `unit`, because `make test-coverage` runs
  # `tests/unit` and `tests/conformance` together and the coverage ratchet counts
  # on both. The duplication is kept on purpose rather than removed: this job
  # reports a conformance failure as a conformance failure, where the same
  # failure inside the coverage run arrives buried in a summary of ten thousand
  # tests. Now that it runs beside `unit` instead of behind it, the duplication
  # costs runner minutes and no wall clock at all.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make test-conformance

  # The ARC authoring-surface canonical vectors are the contract the rest of
  # that phase checks its behavior against, and their value comes from being
  # verified by a second implementation that shares no code with the Python
  # producer. `make all` deliberately does not run this, because Node is not
  # otherwise a dependency of any gate here — which would leave the vectors
  # checked only when someone remembered to run the target. This job is that
  # someone.
  #
  # Node-only: no Python install, no database, so it costs a fraction of the
  # other jobs and needs nothing upstream of it.
  arc-vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: make arc-vectors

  # The same suites again, but with the container runtime taken out of the
  # picture. Without this job the no-container path rots silently: every
  # other job here runs on a runner that has Docker, so `CONTEXTPLANE_TEST_PG=auto`
  # would always pick testcontainers and nothing would ever exercise the
  # locally managed cluster that developers without a runtime depend on.
  #
  # Python 3.12 rather than 3.13 because that is what the pgserver wheels
  # cover. On a developer machine there are other ways to get Postgres
  # (Postgres.app, a system install) and the version does not matter; on a
  # bare runner, pip is the only one, so this job pins to where the wheel is.
  native-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    # Nightly and on-demand, not on every PR. This job proves the
    # no-container-runtime path still works — a developer-environment
    # guarantee, not a production one, since deployments run the container
    # image. It is also the slowest job and the only one depending on an
    # external apt repository, so gating every merge on it buys little and
    # costs a stalled mirror. The full suites below were already
    # schedule-only for the same reason; this extends that to the job.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      CONTEXTPLANE_TEST_PG: devstack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # The `pgserver` wheel ships `plpgsql` and `vector` and nothing else, so
      # it cannot create `btree_gist` -- which revision 0050 needs for the
      # temporal exclusion constraints on `profile_bindings` and
      # `relationship_metadata`. A distro server with contrib can. `initdb` on
      # PATH outranks the wheel in provider resolution, so installing one here
      # is all it takes; the wheel stays installed below so that if this step
      # ever regresses, resolution reports a named missing extension instead of
      # dying fifty revisions into `alembic upgrade head`.
      - name: Install PostgreSQL 16 with contrib and pgvector
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          # Refresh ONLY the PGDG index. A blanket `apt-get update` also polls
          # the runner's Azure Ubuntu mirror, which stalled this step for 22
          # minutes on 2026-08-19 before anything was installed; the image
          # already ships populated lists for everything else, so the wider
          # refresh buys nothing and inherits that mirror's availability.
          # Timeouts bound the remaining network calls rather than trusting them.
          sudo timeout 300 apt-get update \
            -o Dir::Etc::sourcelist=sources.list.d/pgdg.list \
            -o Dir::Etc::sourceparts=- \
            -o APT::Get::List-Cleanup=0
          sudo DEBIAN_FRONTEND=noninteractive timeout 600 apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-contrib-16 postgresql-16-pgvector
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          # Prove the two extensions the schema needs are actually present, here
          # rather than fifty revisions into `alembic upgrade head`.
          ls /usr/share/postgresql/16/extension/btree_gist.control \
             /usr/share/postgresql/16/extension/vector.control

      - run: pip install -e ".[dev,devstack]"

      # What a PR needs from this job is the answer to "does the no-container path
      # work at all" -- lease, template creation, migration to head, teardown. That
      # is a lifecycle question, and none of it is version-specific. Running the
      # complete tier a second time to ask it duplicated the whole suite on every
      # PR to re-derive one bit, and the duplicate is the slowest job in the
      # pipeline. The focused target treats a skip as a failure, so an absent
      # provider cannot answer this by declining to run.
      #
      # This is deliberately NOT a parity measurement. Parity is claimed where both
      # providers are pinned to one major, which is CI, and it is the scheduled run
      # below plus the container tier above that establish it. A developer host
      # resolves whatever Postgres it has, so what this proves there is the
      # mechanism, not the version.
      - if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: make test-native-provider

      # Completeness on the native provider is preserved, moved rather than
      # dropped: nightly and on-demand run the full suites, where the wall-clock
      # cost is nobody's PR. Losing this would let the no-container path rot
      # silently, which is the whole reason this job exists.
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: make test-conformance
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: make test-integration

      # And the stack itself: bring it up, confirm every service reports
      # healthy, exercise the auth round-trip, tear it down.
      - run: make dev-up
      - run: make dev-status
      - run: make dev-token
      - name: authenticated request against the local stack
        run: |
          TOKEN=$(make dev-jwt)
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8000/v1/whoami
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/v1/capabilities)" = "401"

      # The only test that drives a real JWT over a socket into a running
      # registry — discovery, JWKS, signature, entitlement lookup, tenant
      # resolution. The test is opt-in (COMPOSE_STACK_UP) so it never joins a
      # developer's suite by ambient accident; this job is the one place a
      # stack is guaranteed up, so it opts in explicitly and `make test-smoke`
      # treats a skip as a failure.
      - run: make test-smoke
        env:
          COMPOSE_STACK_UP: "1"
      - if: always()
        run: make dev-logs LINES=100
      - if: always()
        run: make dev-down

  # Builds the image and proves it still embeds with no network access.
  #
  # Everything else here tests the source tree, where the model artifact is
  # either absent (tests skip) or stubbed. That leaves the parts that only
  # exist in the image untested: the artifact download, the checksum manifest
  # in contextplane/embedding/, the build-time verification pass, and the claim
  # that a running container needs no egress.
  #
  # The failure this is really guarding against is a stale checksum. The
  # manifest pins bytes on a host nobody here controls; if those bytes are
  # re-uploaded, every build starts failing and without this job the first
  # sign of it would be a release.
  #
  # `make test-airgap` runs the container on a Docker network created with
  # --internal, asserts egress is genuinely unavailable, then drives ingest,
  # the embedding drain, and an ANN search against a Postgres on that network.
  # The model is pre-fetched on the runner and handed to the build as a
  # staged directory: the public hub rate-limits shared runner IPs, so the
  # in-build fetch fails here while succeeding on every other machine. The
  # cache key is the checksum manifest, so re-uploaded bytes still invalidate
  # the cache and fail verification — the manifest stays the trust anchor.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same reasoning as `integration`: the build consumes nothing `unit` makes.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        id: model-cache
        with:
          path: .model-cache
          key: embedding-model-${{ hashFiles('contextplane/embedding/model_manifest.json') }}
      - if: steps.model-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch_embedding_model.py --out .model-cache/all-MiniLM-L6-v2
      - run: make test-airgap
        env:
          EMBEDDING_MODEL_SOURCE: /build/.model-cache/all-MiniLM-L6-v2
      # The container-level sandbox isolation proofs (marked
      # `arc_sandbox_container`) are deliberately NOT run here yet. They pass
      # on a macOS Docker Desktop host and fail on this Linux runner, and the
      # cause is not yet diagnosed -- job logs need authentication this
      # checkout does not have, and a GitHub runner is not reproducible
      # locally. Wiring them in while red would have made every future run
      # ambiguous, which is the failure this project already recorded twice.
      #
      # Consequence, stated rather than buried: those four isolation controls
      # (container memory ceiling, cpuset affinity, read-only rootfs, the
      # dedicated socket group) are proven by evidence captured when they were
      # written, and are NOT continuously enforced. Run them deliberately with
      # `ARC_SANDBOX_CONFORMANCE=1 pytest tests/conformance -m arc_sandbox_container`
      # on a host with Docker before changing anything under
      # `contextplane/arc/sandbox/`, the Dockerfile, or `deploy/helm/values.yaml`.

  # Latency and scale checks. Off the PR path deliberately: the scale fixture
  # seeds a million rows, and `make test-perf` allows 300s per test item
  # including that setup, so a slower runner would flake rather than fail
  # honestly. Nightly and on demand, where a slow run costs nobody a review.
  perf:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install-dev
      - run: make test-perf

  # The single check `main` requires, and the reason it exists rather than
  # requiring `unit` directly.
  #
  # A required status check must be able to *report* on every PR. `unit` cannot:
  # it is conditional on `changes.outputs.code`, so a docs-only PR skips it, and
  # GitHub reads a skipped required check as permanently pending rather than as
  # satisfied. Requiring it would block exactly the PRs it was never meant to
  # run on. That is why protection had drifted to lint and typecheck — the two
  # unconditional jobs — leaving a PR whose test tier was red mergeable, which
  # is how #51 landed a broken unit suite on main.
  #
  # This job always runs, so it can be required, and it decides for itself what
  # each upstream result means: `success` and `skipped` pass, anything else --
  # failure, cancellation, a job that never started -- fails.
  #
  # **`skipped` counts as passing, and that is safe only because of how the
  # graph is shaped.** A tier is skipped for one of two reasons: its own `if`
  # declined (docs-only, or nightly-only), or something it needed failed. In the
  # second case the *failure* is also in this list, because every conditional
  # tier needs `unit` and `unit` needs `changes`, both of which are gated here.
  # So a skip can never hide a failure behind it. A new job that depends on
  # something outside this list breaks that argument and must be added here.
  gate:
    timeout-minutes: 5
    if: always()
    needs:
      - changes
      - lint
      - typecheck
      - unit
      - integration
      - conformance
      - arc-vectors
      - image
      # Nightly-only, and listed anyway. On a PR they skip and cost nothing; on
      # the scheduled run this makes the gate mean "the whole run is green"
      # rather than "the PR subset is green", which is the only place those two
      # tiers ever report.
      - native-stack
      - perf
    runs-on: ubuntu-latest
    steps:
      - name: every tier passed or was deliberately skipped
        env:
          # Through the environment, not string-interpolated into the script:
          # `${{ }}` inside a `run` block splices attacker-influenceable text
          # straight into the shell.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS"])
          for name, job in sorted(needs.items()):
              print(f"{job['result']:>10}  {name}")

          bad = sorted(n for n, j in needs.items() if j["result"] not in ("success", "skipped"))
          if bad:
              print("\nnot green: " + ", ".join(bad))
              sys.exit(1)
          print("\nall tiers green")
          PY

