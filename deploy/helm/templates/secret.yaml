{{- if or (.Values.secrets).databaseUrl (.Values.secrets).pgbouncerUrl (.Values.secrets).schedulerJobstoreUrl (.Values.secrets).oidcDiscoveryUrl (.Values.secrets).githubWebhookSecret (.Values.secrets).gitlabWebhookSecret (.Values.secrets).claudeApiKey ((.Values.metrics).auth).token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "registry.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
  annotations:
    # Prevent Helm from storing secret values in release history in plain text.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if (.Values.secrets).databaseUrl }}
  DATABASE_URL: {{ (.Values.secrets).databaseUrl | quote }}
  {{- end }}
  {{- if (.Values.secrets).pgbouncerUrl }}
  PGBOUNCER_URL: {{ (.Values.secrets).pgbouncerUrl | quote }}
  {{- end }}
  {{- if (.Values.secrets).schedulerJobstoreUrl }}
  SCHEDULER_JOBSTORE_URL: {{ (.Values.secrets).schedulerJobstoreUrl | quote }}
  {{- end }}
  {{- if (.Values.secrets).oidcDiscoveryUrl }}
  OIDC_DISCOVERY_URL: {{ (.Values.secrets).oidcDiscoveryUrl | quote }}
  {{- end }}
  {{- if (.Values.secrets).githubWebhookSecret }}
  GITHUB_WEBHOOK_SECRET: {{ (.Values.secrets).githubWebhookSecret | quote }}
  {{- end }}
  {{- if (.Values.secrets).gitlabWebhookSecret }}
  GITLAB_WEBHOOK_SECRET: {{ (.Values.secrets).gitlabWebhookSecret | quote }}
  {{- end }}
  {{- if (.Values.secrets).claudeApiKey }}
  CLAUDE_API_KEY: {{ (.Values.secrets).claudeApiKey | quote }}
  {{- end }}
  {{- if and ((.Values.metrics).auth).token (not ((.Values.metrics).auth).existingSecret) }}
  {{ ((.Values.metrics).auth).secretKey }}: {{ ((.Values.metrics).auth).token | quote }}
  {{- end }}
{{- else }}
# Secret not rendered — provide secrets.databaseUrl (required) plus any of the
# optional secrets.* keys documented in values.yaml, at install time (--set or
# an external secret manager).
# Example using External Secrets Operator:
#   kubectl create secret generic registry \
#     --from-literal=DATABASE_URL=...
{{- end }}
