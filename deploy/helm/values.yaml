# Default values for registry.
# Override in a values file or with --set.

replicaCount: 2

image:
  repository: ghcr.io/registry/registry
  pullPolicy: IfNotPresent
  # Overridden by the release pipeline; default matches Chart appVersion.
  tag: "0.0.1"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  # 1500 (`arc-sandbox` in the image's Dockerfile) is `registry`'s only
  # group, not merely a supplementary one, and it is dedicated to this
  # purpose rather than reused from some other pod-security convention: the
  # ARC parser/drafter sandbox sockets under /tmp are created by this same
  # process, so they inherit this GID by the ordinary Unix new-file rule and
  # come up mode 0660, group-owned by a group that exists for exactly this.
  # Setting it here, not just in the image, matters because Kubernetes'
  # own runAsGroup/fsGroup — when set — override whatever GID the image's
  # USER directive would otherwise apply; leaving this at the image's old
  # default (999, the same as runAsUser) would have silently put the group
  # back to a non-dedicated value at every pod start regardless of what the
  # Dockerfile does.
  runAsGroup: 1500
  fsGroup: 1500

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: catalog.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Sized around the in-process embedding model, which dominates this pod's
# footprint. Measured on the shipped all-MiniLM-L6-v2 ONNX artifact: ~212 MB
# resident once the model is loaded, peaking near 340 MB while encoding a
# batch of 32 — the drain's default batch size. The rest of the app stack adds
# roughly 100-150 MB, so the working set sits near 500 MB and the previous
# 512Mi limit had no headroom at all.
#
# EMBEDDING_PROVIDER=http or =stub removes the model from the process entirely;
# those deployments can run at 256Mi/512Mi.
#
# ARC's parser/drafter sandboxes (registry.arc.sandbox.parser_main,
# drafter_main) run as subprocesses of this same container, each with its own
# 512 MiB RLIMIT_AS ceiling applied *after* Python has finished starting —
# not a second container, so this pod's own memory.limits is the outer,
# real, kernel-enforced ceiling that bounds both the base app and whichever
# one sandbox subprocess is running (drafter.py runs the parser hop to
# completion and terminates it before starting the drafter hop, so it is
# one at a time per request, not both at once). ~500 MB base + a single
# sandbox process's 512 MiB ceiling is ~1012 MB — inside the previous 1Gi
# limit by only ~12 MB, which is not real headroom once page cache and a
# few concurrent requests are accounted for. Raised to 1536Mi so one
# in-flight sandbox call has genuine room under the base working set.
#
# What this does not bound: several *concurrent* drafting requests each
# spawn their own sandbox pair, and nothing here (or in registry.arc.
# service.drafter) caps how many can be in flight at once — a request-rate
# concern for whoever configures autoscaling/rate limits on this endpoint,
# not something a per-pod memory ceiling can fix by itself.
#
# CPU: `limits.cpu` is a CFS bandwidth quota (a scheduling budget), not the
# ADR's "one CPU" *core-affinity* allocation — the two are genuinely
# different kernel mechanisms. Real per-process CPU pinning for the sandbox
# subprocesses needs the node's kubelet running `--cpu-manager-policy=static`
# (a cluster operator's node-level choice, which no Helm chart can set) with
# this pod in the Guaranteed QoS class (requests == limits for every
# container). Neither is set here by default because Guaranteed QoS
# reserves the full CPU/memory limit per pod up front, which is a real
# scheduling-density tradeoff this chart should not impose on every
# installation silently. `docker run --cpuset-cpus=0` achieves the same
# affinity restriction directly, with no cluster cooperation needed, for
# any deployment target that runs plain Docker rather than Kubernetes.
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1536Mi

# Shutdown behaviour on a rolling update or an eviction.
#
# Two independent waits happen before the pod is gone, and both need room
# inside the grace period or the kubelet kills the container mid-teardown —
# discarding queued spans and any delivery attempt in flight.
#
# preStopSleepSeconds covers a race that is invisible until it bites: the
# kubelet sends SIGTERM and the endpoints controller removes the pod from
# Service endpoints at the same time, so traffic can still arrive at a
# container that has already stopped accepting it. Sleeping first means the
# removal has propagated before shutdown begins. The app needs no cooperation
# for this — the sleep is the whole mechanism.
#
# The server itself then stops waiting for open connections after its own
# --timeout-graceful-shutdown (5s, set in the image's CMD) and runs the
# application teardown. The streaming endpoint is why that bound exists: a
# client holds the response open for the life of its session, so shutdown
# would otherwise wait for a client that has no reason to leave.
#
# Keep terminationGracePeriodSeconds > preStopSleepSeconds + 5 + margin.
terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5

# Application environment configuration.
#
# The CANONICAL inventory of env vars lives in `.env.example` at the
# repo root. This block mirrors it for one supported deployment target
# (Kubernetes via Helm). For AWS ECS / Lambda / EC2 / Cloud Run / etc.,
# use `.env.example` directly when populating your task definition,
# function environment, or systemd EnvironmentFile.
#
# Non-secret keys go here; secrets go in the `secrets:` block below
# and are rendered into a separate Secret via templates/secret.yaml.
env:
  # --- Database (PGBOUNCER_URL + SCHEDULER_JOBSTORE_URL default to DATABASE_URL).
  # DATABASE_URL is REQUIRED — provide via the `secrets:` block below.
  SCHEDULER_USE_MEMORY_JOBSTORE: "false"

  # --- Embedding.
  # The model ships inside the image at EMBEDDING_MODEL_PATH, so no egress, no
  # PVC, and no writable mount is needed — which is what makes the pod runnable
  # with readOnlyRootFilesystem and no network policy exception.
  EMBEDDING_PROVIDER: "onnx"
  EMBEDDING_MODEL: "all-MiniLM-L6-v2"
  EMBEDDING_MODEL_PATH: "/opt/models/all-MiniLM-L6-v2"
  EMBEDDING_DIM: "384"
  EMBEDDING_CHUNK_TOKENS: "400"
  EMBEDDING_CACHE_MAXSIZE: "10000"

  # --- Outbox + drain.
  OUTBOX_POLL_INTERVAL_S: "5"
  OUTBOX_BATCH_SIZE: "32"
  OUTBOX_MAX_ATTEMPTS: "5"
  BACKFILL_BATCH_SIZE: "64"

  # --- Webhook delivery.
  WEBHOOK_DRAIN_INTERVAL_S: "5"
  WEBHOOK_REQUEST_TIMEOUT_S: "10.0"
  WEBHOOK_BATCH_SIZE: "50"

  # --- HTTP method routing.
  # Default 'rest' = standard PATCH/DELETE only. Set 'both' if you are
  # behind an enterprise proxy that strips non-GET/POST verbs.
  REGISTRY_HTTP_METHODS_MODE: "rest"
  REGISTRY_HTTP_METHOD_ALIAS_SEPARATOR: "colon"

  # --- Rate limiting.

  # --- OpenTelemetry.
  # OTLP_ENDPOINT is not listed here (no default disables trace export, same
  # as .env.example) but is not a secret either — a collector URL, not a
  # credential. Add it directly to this map when you want tracing:
  #   env:
  #     OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
  # The ConfigMap template ranges over this whole map, so no template edit
  # is needed to add it.
  SERVICE_NAME: "registry"

  # --- Sync connectors.
  CONNECTOR_RUN_TIMEOUT_S: "300"

  # --- Performance / SLO.
  EMBEDDINGS_PARTITION_COUNT: "8"

  # Operational LOG_LEVEL — read by the standard Python logging config.
  LOG_LEVEL: "info"

# Required secret values — provide these at install time.
# Example: --set secrets.databaseUrl="postgresql://user:pass@host/db"
#
# Every key here is rendered into the Secret by templates/secret.yaml under
# its literal env-var name (see that template) — this is the complete set;
# a key documented here with no matching `{{- if (.Values.secrets).x }}`
# block in secret.yaml (or vice versa) is exactly the drift class
# `make helm-env` (scripts/check_helm_env.py) exists to catch.
# An explicit empty map, not a bare key: `secrets:` followed only by comments
# parses as nil, and every `.Values.secrets.x` lookup then fails the render.
secrets: {}
  # databaseUrl: ""              # required — DATABASE_URL
  # pgbouncerUrl: ""             # optional — PGBOUNCER_URL. Defaults to databaseUrl when unset,
  #                                which means the pod connects straight to Postgres and the
  #                                pgbouncer sidecar below (on by default) runs unused rather than
  #                                broken — set this to databaseUrl's own credentials with the host
  #                                swapped to 127.0.0.1:5432 to actually route through it.
  # schedulerJobstoreUrl: ""     # optional — SCHEDULER_JOBSTORE_URL (defaults to databaseUrl)
  # oidcDiscoveryUrl: ""         # optional — OIDC_DISCOVERY_URL
  # githubWebhookSecret: ""      # optional — GITHUB_WEBHOOK_SECRET
  # gitlabWebhookSecret: ""      # optional — GITLAB_WEBHOOK_SECRET
  # claudeApiKey: ""             # optional — CLAUDE_API_KEY. Required only when env.EXTRACTION_PROVIDER
  #                                is "anthropic"; ANTHROPIC_API_KEY is accepted by the app as an alias
  #                                for the same field, but this chart only ever renders CLAUDE_API_KEY.

# Runs as a sidecar in the same pod as the API (deployment-api.yaml), always
# reachable on loopback -- but the app only actually talks to it when
# secrets.pgbouncerUrl points there (see that key's comment above). Enabling
# this without also setting secrets.pgbouncerUrl deploys the sidecar and
# leaves it unused: not broken, since the app still reaches Postgres directly
# via databaseUrl, but not doing the pooling this section exists for either.
pgbouncer:
  enabled: true
  image:
    repository: bitnami/pgbouncer
    tag: "1.22.1"
    pullPolicy: IfNotPresent
  poolMode: transaction
  maxClientConn: 100
  defaultPoolSize: 20
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

syncWorker:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}

# Metrics exposition.
#
# GET /metrics requires a bearer credential and returns 503 without one. There
# is no unauthenticated mode: the exposition publishes the full route table,
# entitlement-failure counts, rate-limit rejections, and the MCP tool catalog
# with per-tool call counts, and /metrics is exempt from rate limiting.
#
# Supply the credential one of two ways:
#   auth.token         — chart-managed, written into the release Secret.
#                        Simplest, but the value transits Helm release history.
#   auth.existingSecret — a Secret you manage (External Secrets, Vault Agent,
#                        sealed-secrets). Preferred for production.
metrics:
  auth:
    # --set metrics.auth.token="$(openssl rand -hex 32)"
    token: ""
    # Name of a pre-existing Secret holding the credential. Takes precedence
    # over auth.token when both are set.
    existingSecret: ""
    # Key within whichever Secret carries the credential.
    secretKey: "METRICS_BEARER_TOKEN"

  # Prometheus Operator ServiceMonitor.
  #
  # Off by default, and additionally guarded on the CRD being present: a chart
  # that renders a ServiceMonitor into a cluster without the Prometheus
  # Operator fails `helm install` outright on an unknown kind, which turns an
  # optional integration into a broken install.
  #
  # Note that podAnnotations already carry prometheus.io/scrape: "true" and
  # stay that way. Annotation-based discovery and a ServiceMonitor are two
  # different scrape mechanisms; leaving discovery on means a Prometheus that
  # has not been given the credential reports this target DOWN with a 401,
  # which is diagnosable. Turning it off alongside a default-off ServiceMonitor
  # would leave a default install silently unmonitored, which is worse.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels, e.g. `release: kube-prometheus-stack` when the operator's
    # serviceMonitorSelector requires it.
    labels: {}

# Grafana dashboard provisioning.
# Set to true when deploying alongside kube-prometheus-stack or a Grafana operator.
grafana:
  dashboards:
    enabled: false
    namespace: ""  # defaults to Release.Namespace
