# =============================================================================
# LOCAL DEVELOPMENT ONLY — NOT A DEPLOYMENT TEMPLATE
# =============================================================================
# This file exists to give a developer the whole stack in one command. It is
# not hardened and must not be used as the starting point for a deployment:
#
#   - Postgres has a hardcoded, published password and listens on all
#     interfaces.
#   - Grafana ships with admin/admin and anonymous viewer access enabled.
#   - The IDP and entitlement services are mocks that accept any credentials.
#   - OIDC_MAX_TOKEN_TTL_SECONDS is relaxed to 3600s, four times the
#     production default.
#
# For deployment, start from the example Helm chart in deploy/helm/, which
# mirrors .env.example and takes every secret from the operator.
#
# `make dev-up` runs the same services as ordinary local processes, on the
# same ports, for machines without a container runtime. The two cannot run at
# once. See docs/07-contributing/01-local-dev.md.
#
# Host ports avoid conflicts with a sibling stack on the default 5432.
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: registry
    ports:
      - "5544:5432"
    volumes:
      - cap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d registry"]
      interval: 2s
      timeout: 2s
      retries: 30

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: registry
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: 6432
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: applies migrations, then exits 0. `api` depends on it completing
  # successfully rather than merely on `postgres` being healthy, because the
  # app queries tables (`sync_sources`, for scheduled sync-job registration)
  # during its own startup — before this ran, that query 500s with
  # `UndefinedTableError` and `uvicorn --reload`'s supervisor process stays
  # "Up" without ever retrying the crashed worker, so the container looks
  # healthy while serving nothing. `make migrate` (documented as the next
  # step) still works standalone against an already-migrated database —
  # Alembic is idempotent — this only removes the race on first boot.
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/registry
    entrypoint: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@pgbouncer:6432/registry
      PGBOUNCER_URL: postgresql+asyncpg://postgres:password@pgbouncer:6432/registry
      SCHEDULER_JOBSTORE_URL: postgresql+asyncpg://postgres:password@postgres:5432/registry
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      SERVICE_NAME: registry
      # Job kwargs (session_factory, embedder) aren't picklable, so SQLAlchemyJobStore
      # cannot persist them. Use MemoryJobStore until persisted jobs are needed.
      SCHEDULER_USE_MEMORY_JOBSTORE: "true"
      # Zero vectors for the contributor stack: `docker compose up` should not
      # depend on a 90 MB model artifact being staged. Semantic ranking is inert
      # here — the lexical arm decides order. Set EMBEDDING_PROVIDER=onnx to
      # exercise real retrieval against the model baked into the image.
      EMBEDDING_PROVIDER: "stub"
      # OIDC + entitlement wiring against the local mock services. The
      # mock IDP echoes the request Host as the issuer, so tokens minted
      # from the host (`localhost:8090`) and from inside the compose
      # network (`mock-oauth2-server:8080`) carry different `iss` values
      # — both forms are allowlisted so either developer path works.
      OIDC_DISCOVERY_URL: http://mock-oauth2-server:8080/default/.well-known/openid-configuration
      OIDC_ISSUER_ALLOWLIST: "http://mock-oauth2-server:8080/default,http://localhost:8090/default"
      RESOURCE_URI_ALLOWLIST: registry
      ENTITLEMENT_SERVICE_URL: http://mock-entitlement-service:8000
      ENTITLEMENT_SERVICE_ENV: DEV
      ENTITLEMENT_SERVICE_DISCRIMINATOR: REGISTRY
      ENTITLEMENT_ROLE_MAPPING: "ADMIN:admin,PRODUCER:producer,CONSUMER:consumer,AUDITOR:auditor"
      # Mock-oauth2-server issues 3600s tokens by default; the production
      # default ceiling (900s) is below that, so dev would reject every
      # JWT for token-ttl-exceeded. Relaxing only in compose is a dev
      # affordance, not a production posture.
      OIDC_MAX_TOKEN_TTL_SECONDS: "3600"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      postgres:
        condition: service_healthy
      mock-oauth2-server:
        condition: service_started
      mock-entitlement-service:
        condition: service_healthy

  # Local-dev IDP. Issues JWTs that the registry's OIDC validator can
  # consume after pointing OIDC_DISCOVERY_URL at it. NEVER deployed to
  # production — the registry's production deployments point at the
  # enterprise ADFS endpoint instead.
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "8090:8080"
    # The image is JVM-based (jre-alpine) and does not bundle curl/wget,
    # so a probe-based compose healthcheck would fail even when the
    # service is up. Integration tests retry against the discovery
    # endpoint at startup; compose just guarantees the container is
    # running via depends_on: service_started above.

  # Local-dev entitlement-service stand-in. Returns canned entitlement
  # responses keyed by userId; controlled by integration tests via the
  # admin endpoints. NEVER deployed to production.
  mock-entitlement-service:
    build: ./scripts/devstack/mocks/entitlement_service
    ports:
      - "8091:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP HTTP

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      # These live under deploy/. Pointing at a path that does not exist
      # is not a startup error — Docker silently creates an empty directory
      # at the source and mounts that, so Grafana comes up with no datasource
      # and no dashboards and nothing says why.
      # Datasource provisioning
      - ./deploy/helm/grafana-dashboards/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      # Dashboard provisioning config
      - ./deploy/helm/grafana-dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      # Dashboard JSON files
      - ./deploy/helm/grafana-dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  cap_postgres_data:
